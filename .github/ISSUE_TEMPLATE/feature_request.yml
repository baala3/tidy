name: Feature request
description: Suggest something new, such as a cache location Tidy should offer.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why Tidy doesn't help today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: For a new cache location, give the path, the app that owns it, and whether the app rebuilds it by itself.
    validations:
      required: true
