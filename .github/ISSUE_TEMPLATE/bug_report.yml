name: Bug report
description: Something in Tidy doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If Tidy removed or offered something it should not, please [report it privately](https://github.com/baala3/tidy/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what Tidy did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tidy
        2. ...
    validations:
      required: true
  - type: input
    id: tidy-version
    attributes:
      label: Tidy version
      description: Shown on the About page.
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` to see it, e.g. Windows 11 24H2 (26100.4061).
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
