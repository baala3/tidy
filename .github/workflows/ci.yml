name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project tests/Tidy.Core.Tests -c Release
      - name: Build app
        run: dotnet build src/Tidy.App -c Release -p:Platform=x64
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build website
        run: node scripts/build-site.mjs
