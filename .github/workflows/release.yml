name: Release

# Push a tag like v0.2.0 to build, test and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project tests/Tidy.Core.Tests -c Release
      - name: Publish x64 and Arm64
        shell: pwsh
        run: ./build.ps1 -Target publish -Version ("${{ github.ref_name }}".TrimStart('v'))
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/Tidy-Setup-x64.exe artifacts/Tidy-Setup-arm64.exe `
            artifacts/Tidy-win-x64.zip artifacts/Tidy-win-arm64.zip artifacts/SHA256SUMS.txt `
            --title "Tidy ${{ github.ref_name }}" --generate-notes --verify-tag
      # A release made with the workflow token triggers no other workflows, so start
      # the website build here; it picks up the new version and download links.
      - name: Update website
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
