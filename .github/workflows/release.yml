name: Release

# Push a tag like v0.2.0 to build, test and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project tests/Tidy.Core.Tests -c Release
      - name: Publish x64 and Arm64
        shell: pwsh
        run: ./build.ps1 -Target publish -Version ("${{ github.ref_name }}".TrimStart('v'))
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/Tidy-win-x64.zip artifacts/Tidy-win-arm64.zip artifacts/SHA256SUMS.txt `
            --title "Tidy ${{ github.ref_name }}" --generate-notes --verify-tag
